<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APHELION - Login</title>
    <link rel="shortcut icon" href="../icons/iconAphelion.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="../icons/iconAphelion.png">
            <h1>Aphelion</h1>
        </div>
        <img class="theme" src="../icons/iconTheme.png">
    </header>
    <main>
        <div class="description-site">
            <p>Aphelion é uma rede social que conecta pessoas com interesses em comum, facilitando interações e
                descobertas entre uma comunidade.</p>
        </div>
        <div class="login">
            <fieldset>
                <legend>LOGIN</legend>
                <label for="email">Insira seu E-mail</label>
                <input style="height: 7vh;" class="input" type="email" id="email">
                <label for="pass">Insira sua Senha</label>
                <div class="password-container">
                    <input style="height: 7vh;" class="input" type="password" id="pass">
                    <img class="eye" src="../icons/closeEye.png" alt="Mostrar/ocultar senha">
                </div>

                <div class="btns">
                    <input type="button" value="Logar">
                    <p>Caso nao tenha uma conta:</p>
                    <input id="signUp" type="button" value="Cadastre-se">
                </div>
            </fieldset>
        </div>
    </main>
    <footer>
        <h1>&copy;BusaiKuna</h1>
    </footer>
    <script src="../javascript/theme.js"></script>
    <script src="../javascript/api-request-index.js"></script>
    <script src="../javascript/form.js"></script>
    <script>
        let eye = document.querySelector(".eye")
        let pass = document.querySelector("#pass")

        eye_clicked = false

        eye.addEventListener("click", () => {
            if (!eye_clicked) {
                pass.type = "text"
                eye.src = "../icons/openEye.png"
            } else {
                pass.type = "password"
                eye.src = "../icons/closeEye.png"
            }
            switch (eye_clicked) {
                case false:
                    eye_clicked = true
                    break;
                case true:
                    eye_clicked = false
                    break;
            }
        })
    </script>
</body>

</html>
