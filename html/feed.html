<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aphelion</title>
    <link rel="stylesheet" href="../css/feed.css">
    <link rel="stylesheet" href="../css/geral.css">
    <link rel="shortcut icon" href="../icons/iconAphelion.png" type="image/x-icon">
</head>

<body style="visibility: visible; overflow: auto;" cz-shortcut-listen="true">
    <header class="top-header">
        <div class="header-content">
            <div class="logo">
                <img src="../icons/iconAphelion.png">
                <h1>Aphelion</h1>
            </div>
            <nav class="top-nav">
                <a href="feed.html" class="nav-item active">Feed</a>
                <a href="notifications.html" class="nav-item">Notifications</a>
                <a href="chat.html" class="nav-item">Messages</a>
                <a href="profile.html" class="nav-item">Profile</a>
            </nav>
            <div class="user-avatar">
                <a href="profile.html">
                    <img src="https://res.cloudinary.com/dl3arbevw/image/upload/v1758140491/profiles/n5xus5ukqp0ik15rx4ut.webp"
                        alt="User">
                </a>
            </div>
        </div>
    </header>
    <div id="loading" style="display: none;"><img src="../icons/loading.gif" alt=""></div>
    <div id="fullscreen"><span>x</span><img
            src="https://imgs.search.brave.com/jhbw8zyLFTgGwiOYsZZyExuuXXbGfqnjtgHiICLwtVo/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJjYXZlLmNv/bS93cC93cDYyNTg4/MzIuanBn"
            alt=""></div>
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="profile">
                    <div class="profile-image">
                        <img style=" width: 45px; height: 45px; border-radius: 100%;" class="image-profile"
                            src="https://res.cloudinary.com/dl3arbevw/image/upload/v1758140491/profiles/n5xus5ukqp0ik15rx4ut.webp">
                    </div>
                    <div class="profile-info">
                        <h2 id="username">Busaikuna</h2>
                        <p>busaikuna#0000</p>
                    </div>
                </div>
                <div class="new-post" onclick="openModal()">
                    <img src="../icons/moreIcon.png">
                    <h1>New Post</h1>
                </div>
                <ul class="sidebar-menu">
                    <li>Notifications</li>
                    <li>Messages</li>
                    <li>Settings</li>
                </ul>
            </div>
        </nav>
        <main class="content">
            <section class="post-section">
            </section>
        </main>
    </div>

    <div id="newPostModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Post</h2>
                <span class="close" onclick="closeModal()">×</span>
            </div>
            <form id="newPostForm" class="modal-body">
                <div class="form-group">
                    <label for="postContent">O que quer postar hoje?</label>
                    <textarea id="postContent" placeholder="Compartilhe o que pensa..." required=""></textarea>
                </div>
                <div class="form-group">
                    <label for="postImage">Adicione uma Foto (opcional)</label>
                    <input type="file" id="postImage" accept="image/*" onchange="previewImage(event)">
                    <div id="imagePreview" class="image-preview"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-post">Post</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../javascript/api-request-post.js"></script>
    <script src="../javascript/modal-post.js"></script>
    <script src="../javascript/create-post.js"></script>

</body>

</html>
